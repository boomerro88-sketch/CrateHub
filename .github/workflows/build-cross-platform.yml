name: Build CrateHub installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: Apple-Silicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          command -v ffmpeg
      - name: Build native application
        run: python packaging/build.py
      - name: Test bundled tools and catalogue
        run: |
          export CRATE_DESKTOP_DATA="$RUNNER_TEMP/cratehub-selftest"
          set -o pipefail
          dist/CrateHub.app/Contents/MacOS/CrateHub --self-test | tee "$RUNNER_TEMP/cratehub-result.json"
          grep '"ok": true' "$RUNNER_TEMP/cratehub-result.json"
          codesign --verify --deep --strict dist/CrateHub.app
          file dist/CrateHub.app/Contents/MacOS/CrateHub
      - name: Create DMG
        run: |
          mkdir -p release staging
          ditto dist/CrateHub.app staging/CrateHub.app
          ln -s /Applications staging/Applications
          hdiutil create -volname CrateHub -srcfolder staging -format UDZO "release/CrateHub-1.2.0-macOS-${{ matrix.arch }}.dmg"
          hdiutil verify "release/CrateHub-1.2.0-macOS-${{ matrix.arch }}.dmg"
          shasum -a 256 release/*.dmg > "release/CrateHub-1.2.0-macOS-${{ matrix.arch }}-SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: CrateHub-macOS-${{ matrix.arch }}
          path: release/*
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Download x64 FFmpeg and Node
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools,build | Out-Null
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-tools
          $bin = (Get-ChildItem ffmpeg-tools -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory.FullName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Invoke-WebRequest 'https://nodejs.org/download/release/v22.23.4/win-x64/node.exe' -OutFile tools/node.exe
          (Resolve-Path tools).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature build/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 publisher signature' }
      - name: Build self-contained x64 application
        run: python packaging/build.py
      - name: Check bundled dependencies
        shell: pwsh
        run: |
          $env:CRATE_DESKTOP_DATA = "$env:RUNNER_TEMP\cratehub-test"
          $p = Start-Process -FilePath "dist\CrateHub\CrateHub.exe" -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Get-Content "$env:CRATE_DESKTOP_DATA\desktop.log"; throw 'Self-test timed out' }
          Get-Content "$env:CRATE_DESKTOP_DATA\desktop.log"
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }
      - name: Smoke test native window and assets
        shell: pwsh
        run: ./packaging/smoke_windows.ps1
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          Get-ChildItem release/*x64*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/CrateHub-1.2.0-Windows-x64-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrateHub-Windows-x64
          path: release/*
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrateHub-Windows-x64-diagnostics
          path: |
            ${{ runner.temp }}/cratehub-test/desktop.log
            ${{ runner.temp }}/cratehub-ui-test/desktop.log
