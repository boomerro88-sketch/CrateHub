name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Download official FFmpeg Windows build
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg-tools
          $bin = (Get-ChildItem ffmpeg-tools -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory.FullName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile build/MicrosoftEdgeWebview2Setup.exe
          $signature = Get-AuthenticodeSignature build/MicrosoftEdgeWebview2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid WebView2 publisher signature' }
      - name: Build self-contained application
        run: python packaging/build.py
      - name: Check bundled dependencies
        shell: pwsh
        run: |
          $env:CRATE_DESKTOP_DATA = "$env:RUNNER_TEMP\cratehub-test"
          $p = Start-Process -FilePath "dist\CrateHub\CrateHub.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed: $($p.ExitCode)" }
          Get-Content "$env:CRATE_DESKTOP_DATA\desktop.log"
      - name: Smoke test native window and local service
        shell: pwsh
        run: ./packaging/smoke_windows.ps1
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer failed" }
      - name: Generate installer checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/CrateHub-1.1.1-Windows-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CrateHub-Windows-x64-installer
          path: release/*
